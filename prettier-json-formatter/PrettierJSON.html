<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prettier JSON Formatter</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%232563eb'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='16' font-weight='700' fill='white' text-anchor='middle'%3E%7B%7D%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --text: #1d2330;
    --muted: #697386;
    --border: #d9dde5;
    --accent: #2563eb;
    --accent-text: #ffffff;
    --gutter: #f0f2f5;
    --ok: #15803d;
    --ok-bg: #e8f6ec;
    --err: #b42318;
    --err-bg: #fdecea;
    --warn: #9a6700;
    --warn-bg: #fff6dd;
    --sel: #cfe0ff;
    --tk-key: #0451a5;
    --tk-str: #a31515;
    --tk-num: #098658;
    --tk-bool: #0000ff;
    --tk-null: #795e26;
    --tk-punct: #5c6370;
    --tk-comment: #008000;
    --errline: rgba(220, 38, 38, .10);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151b;
      --panel: #1a1e26;
      --text: #e3e7ee;
      --muted: #8d97a8;
      --border: #2d3340;
      --accent: #4f8cff;
      --accent-text: #0b1220;
      --gutter: #161a21;
      --ok: #5fd07f;
      --ok-bg: #16281c;
      --err: #ff8a80;
      --err-bg: #331a1a;
      --warn: #f0c24b;
      --warn-bg: #30280f;
      --sel: #27406e;
      --tk-key: #9cdcfe;
      --tk-str: #ce9178;
      --tk-num: #b5cea8;
      --tk-bool: #569cd6;
      --tk-null: #c586c0;
      --tk-punct: #9aa4b5;
      --tk-comment: #6a9955;
      --errline: rgba(255, 110, 100, .14);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151b;
    --panel: #1a1e26;
    --text: #e3e7ee;
    --muted: #8d97a8;
    --border: #2d3340;
    --accent: #4f8cff;
    --accent-text: #0b1220;
    --gutter: #161a21;
    --ok: #5fd07f;
    --ok-bg: #16281c;
    --err: #ff8a80;
    --err-bg: #331a1a;
    --warn: #f0c24b;
    --warn-bg: #30280f;
    --sel: #27406e;
    --tk-key: #9cdcfe;
    --tk-str: #ce9178;
    --tk-num: #b5cea8;
    --tk-bool: #569cd6;
    --tk-null: #c586c0;
    --tk-punct: #9aa4b5;
    --tk-comment: #6a9955;
    --errline: rgba(255, 110, 100, .14);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  h1 { font-size: 16px; margin: 0; white-space: nowrap; }
  h1 span { color: var(--accent); font-family: ui-monospace, Menlo, Consolas, monospace; }

  .toolbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .toolbar .sep { width: 1px; height: 22px; background: var(--border); margin: 0 4px; }
  button, select {
    font: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 10px;
    cursor: pointer;
  }
  button:hover, select:hover { border-color: var(--accent); }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); font-weight: 600; }
  label.check { display: inline-flex; gap: 4px; align-items: center; font-size: 13px; color: var(--muted); cursor: pointer; user-select: none; }
  .spacer { flex: 1; }

  main { flex: 1; min-height: 0; display: flex; padding: 12px 16px; }
  .editor {
    flex: 1;
    min-width: 0;
    display: flex;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--panel);
    overflow: hidden;
    position: relative;
  }
  .editor.dragging { border-color: var(--accent); box-shadow: 0 0 0 3px var(--sel); }
  .gutter, textarea, .hl {
    font: 13px/20px ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;
    margin: 0;
    padding: 10px 0;
  }
  .gutter {
    background: var(--gutter);
    color: var(--muted);
    text-align: right;
    padding-right: 10px;
    padding-left: 10px;
    border-right: 1px solid var(--border);
    overflow: hidden;
    user-select: none;
    white-space: pre;
    min-width: 44px;
  }
  .gutter .bad { color: var(--err); font-weight: 700; }
  .gutter > div { will-change: transform; }
  .code { flex: 1; min-width: 0; position: relative; overflow: hidden; }
  textarea, .hl {
    position: absolute;
    top: 0;
    left: 0;
    border: 0;
    padding-left: 12px;
    padding-right: 12px;
    white-space: pre;
    tab-size: 2;
    letter-spacing: normal;
    word-spacing: normal;
  }
  textarea {
    width: 100%;
    height: 100%;
    z-index: 1;
    resize: none;
    outline: none;
    background: transparent;
    color: var(--text);
    caret-color: var(--text);
    overflow: auto;
  }
  .highlighting textarea { color: transparent; }
  .highlighting textarea::selection { color: transparent; }
  textarea::selection { background: var(--sel); }
  /* Only the lines on screen are drawn here, moved into place with a transform,
     so coloring costs the same for 100 lines or 100,000. */
  .hl { color: var(--text); pointer-events: none; will-change: transform; }
  .hl .k { color: var(--tk-key); }
  .hl .s { color: var(--tk-str); }
  .hl .n { color: var(--tk-num); }
  .hl .b { color: var(--tk-bool); }
  .hl .z { color: var(--tk-null); }
  .hl .p { color: var(--tk-punct); }
  .hl .c { color: var(--tk-comment); font-style: italic; }
  .errline {
    position: absolute; left: 0; right: 0; height: 20px;
    background: var(--errline);
    border-left: 3px solid var(--err);
    pointer-events: none;
    display: none;
  }
  .placeholder {
    position: absolute;
    left: 70px; top: 10px; right: 16px;
    color: var(--muted);
    pointer-events: none;
    font: 13px/20px ui-monospace, Menlo, Consolas, monospace;
  }

  footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 6px 16px;
    padding: 8px 16px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    font-size: 13px;
  }
  .status { padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .status.ok { color: var(--ok); background: var(--ok-bg); }
  .status.err { color: var(--err); background: var(--err-bg); cursor: pointer; }
  .status.warn { color: var(--warn); background: var(--warn-bg); }
  .status.empty { color: var(--muted); background: var(--gutter); }
  .msg { color: var(--muted); min-width: 0; overflow-wrap: anywhere; }
  .stats { color: var(--muted); margin-left: auto; white-space: nowrap; }
  kbd { font: 11px ui-monospace, Menlo, monospace; border: 1px solid var(--border); border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; }

  .toast {
    position: fixed; left: 50%; bottom: 56px; transform: translateX(-50%) translateY(20px);
    background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px;
    opacity: 0; transition: opacity .15s, transform .15s; pointer-events: none; font-weight: 600;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    header, main, footer { padding-left: 16px; padding-right: 16px; }
    .toolbar .sep, .hint { display: none; }
    .gutter { min-width: 36px; padding-left: 6px; padding-right: 6px; }
    .placeholder { left: 58px; }
    .stats { margin-left: 0; }
  }
</style>
</head>
<body>
<header>
  <h1><span>{}</span> Prettier JSON Formatter</h1>
  <div class="toolbar">
    <button class="primary" id="btnFormat" title="Format (Ctrl+Shift+F)">Format</button>
    <button id="btnMinify" title="Minify (Ctrl+Shift+M)">Minify</button>
    <button id="btnSort" title="Sort object keys A→Z, then format">Sort keys</button>
    <span class="sep"></span>
    <button class="primary" id="btnCopy" title="Copy all (Ctrl+Shift+C)">Copy</button>
    <button id="btnPaste" title="Replace with clipboard and format">Paste</button>
    <button id="btnClear">Clear</button>
    <span class="sep"></span>
    <select id="indent" title="Indent">
      <option value="2">2 spaces</option>
      <option value="4">4 spaces</option>
      <option value="tab">Tabs</option>
    </select>
    <select id="width" title="Short arrays stay on one line if they fit this width">
      <option value="80">Width 80</option>
      <option value="120">Width 120</option>
      <option value="0">Expand all</option>
    </select>
    <label class="check" title="Color keys, strings, numbers and values"><input type="checkbox" id="colors" checked> Colors</label>
    <label class="check" title="Format automatically when you paste"><input type="checkbox" id="autoFormat" checked> Format on paste</label>
    <label class="check" title="Accept comments, trailing commas, single quotes and unquoted keys, and output strict JSON"><input type="checkbox" id="loose" checked> Fix loose JSON</label>
  </div>
  <div class="spacer"></div>
  <div class="toolbar">
    <button id="btnOpen" title="Open a .json file">Open file</button>
    <button id="btnSave" title="Download as .json">Download</button>
    <button id="btnTheme" title="Switch light/dark">☀ Light</button>
    <input type="file" id="file" accept=".json,application/json,text/plain" hidden>
  </div>
</header>

<main>
  <div class="editor" id="editor">
    <div class="gutter" id="gutter">1</div>
    <div class="code highlighting" id="code">
      <pre class="hl" id="hl" aria-hidden="true"></pre>
      <div class="errline" id="errline"></div>
      <textarea id="text" spellcheck="false" autocomplete="off" autocapitalize="off" wrap="off" aria-label="JSON editor"></textarea>
    </div>
    <div class="placeholder" id="placeholder">Paste JSON here (Ctrl+V), or drop a .json file.</div>
  </div>
</main>

<footer>
  <span class="status empty" id="status">Empty</span>
  <span class="msg" id="msg"><span class="hint"><kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>F</kbd> format · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>M</kbd> minify · <kbd>Ctrl</kbd>+<kbd>Shift</kbd>+<kbd>C</kbd> copy all</span></span>
  <span class="stats" id="stats"></span>
</footer>

<div class="toast" id="toast"></div>

<script>
"use strict";

/* ---------- Parser ----------
   Builds a small AST that keeps number and string literals exactly as written,
   so big IDs like 12345678901234567890 and 1.10 are never altered, and key
   order is preserved. In loose mode it also accepts comments, trailing commas,
   single-quoted strings and unquoted keys, and records what it fixed. */

function parseJSON(src, loose) {
  let i = 0;
  const fixes = new Set();

  function pos(at) {
    let line = 1, col = 1;
    for (let k = 0; k < at && k < src.length; k++) {
      if (src[k] === "\n") { line++; col = 1; } else col++;
    }
    return { line, col, offset: at };
  }
  function fail(message, at) {
    const p = pos(at === undefined ? i : at);
    const e = new Error(message);
    e.line = p.line; e.col = p.col; e.offset = p.offset;
    throw e;
  }
  function describe(ch) {
    if (ch === undefined) return "end of input";
    if (ch === "\n") return "a line break";
    return "'" + ch + "'";
  }

  function skip() {
    for (;;) {
      const c = src[i];
      if (c === " " || c === "\t" || c === "\n" || c === "\r" || c === "﻿") { i++; continue; }
      if (c === "/" && (src[i + 1] === "/" || src[i + 1] === "*")) {
        if (!loose) fail("Comments are not allowed in JSON");
        fixes.add("removed comments");
        if (src[i + 1] === "/") {
          while (i < src.length && src[i] !== "\n") i++;
        } else {
          const end = src.indexOf("*/", i + 2);
          if (end < 0) fail("Unclosed /* comment");
          i = end + 2;
        }
        continue;
      }
      return;
    }
  }

  function value() {
    skip();
    const c = src[i];
    if (c === "{") return object();
    if (c === "[") return array();
    if (c === '"' || c === "'") return string();
    if (c === "-" || (c >= "0" && c <= "9")) return number();
    if (src.startsWith("true", i)) { i += 4; return { t: "lit", raw: "true" }; }
    if (src.startsWith("false", i)) { i += 5; return { t: "lit", raw: "false" }; }
    if (src.startsWith("null", i)) { i += 4; return { t: "lit", raw: "null" }; }
    if (loose) {
      if (src.startsWith("undefined", i)) { i += 9; fixes.add("replaced undefined with null"); return { t: "lit", raw: "null" }; }
      if (src.startsWith("True", i)) { i += 4; fixes.add("fixed True/False/None"); return { t: "lit", raw: "true" }; }
      if (src.startsWith("False", i)) { i += 5; fixes.add("fixed True/False/None"); return { t: "lit", raw: "false" }; }
      if (src.startsWith("None", i)) { i += 4; fixes.add("fixed True/False/None"); return { t: "lit", raw: "null" }; }
    }
    fail("Unexpected " + describe(c) + ", expected a value");
  }

  function object() {
    const start = i;
    i++;
    const entries = [];
    skip();
    if (src[i] === "}") { i++; return { t: "obj", entries }; }
    for (;;) {
      skip();
      let key;
      const c = src[i];
      if (c === '"' || c === "'") {
        key = string();
      } else if (loose && c !== undefined && /[A-Za-z_$]/.test(c)) {
        const m = /^[A-Za-z_$][\w$]*/.exec(src.slice(i, i + 256));
        i += m[0].length;
        fixes.add("quoted bare keys");
        key = { t: "str", raw: JSON.stringify(m[0]), text: m[0] };
      } else if (c === undefined) {
        fail("Unclosed object, missing '}'", start);
      } else {
        fail("Expected a \"key\" in double quotes, found " + describe(c));
      }
      skip();
      if (src[i] !== ":") fail("Expected ':' after key " + key.raw + ", found " + describe(src[i]));
      i++;
      const v = value();
      entries.push({ key, value: v });
      skip();
      if (src[i] === ",") {
        const commaAt = i;
        i++;
        skip();
        if (src[i] === "}") {
          if (!loose) fail("Trailing comma before '}'", commaAt);
          fixes.add("removed trailing commas");
          i++;
          return { t: "obj", entries };
        }
        continue;
      }
      if (src[i] === "}") { i++; return { t: "obj", entries }; }
      if (src[i] === undefined) fail("Unclosed object, missing '}'", start);
      fail("Expected ',' or '}' after value, found " + describe(src[i]));
    }
  }

  function array() {
    const start = i;
    i++;
    const items = [];
    skip();
    if (src[i] === "]") { i++; return { t: "arr", items }; }
    for (;;) {
      items.push(value());
      skip();
      if (src[i] === ",") {
        const commaAt = i;
        i++;
        skip();
        if (src[i] === "]") {
          if (!loose) fail("Trailing comma before ']'", commaAt);
          fixes.add("removed trailing commas");
          i++;
          return { t: "arr", items };
        }
        continue;
      }
      if (src[i] === "]") { i++; return { t: "arr", items }; }
      if (src[i] === undefined) fail("Unclosed array, missing ']'", start);
      fail("Expected ',' or ']' after value, found " + describe(src[i]));
    }
  }

  function string() {
    const quote = src[i];
    const start = i;
    if (quote === "'") {
      if (!loose) fail("Strings must use double quotes");
      fixes.add("converted single quotes");
    }
    i++;
    let text = "";
    for (;;) {
      const c = src[i];
      if (c === undefined) fail("Unclosed string", start);
      if (c === quote) { i++; break; }
      if (c === "\n") fail("Line break inside string (use \\n)", i);
      if (c < " ") {
        if (!loose) fail("Control character inside string (use \\t, \\n, …)", i);
        fixes.add("escaped control characters");
        text += c; i++; continue;
      }
      if (c === "\\") {
        const n = src[i + 1];
        const map = { '"': '"', "\\": "\\", "/": "/", b: "\b", f: "\f", n: "\n", r: "\r", t: "\t" };
        if (n in map) { text += map[n]; i += 2; continue; }
        if (n === "u") {
          const hex = src.slice(i + 2, i + 6);
          if (!/^[0-9a-fA-F]{4}$/.test(hex)) fail("Invalid \\u escape", i);
          text += String.fromCharCode(parseInt(hex, 16)); i += 6; continue;
        }
        if (loose && n === "'") { text += "'"; i += 2; continue; }
        fail("Invalid escape \\" + (n === undefined ? "" : n), i);
      }
      text += c; i++;
    }
    // Keep the original spelling of valid double-quoted strings (e.g. é stays é).
    const raw = quote === '"' && !/[\u0000-\u001f]/.test(src.slice(start, i))
      ? src.slice(start, i)
      : JSON.stringify(text);
    return { t: "str", raw, text };
  }

  function number() {
    const m = /^-?(0|[1-9]\d*)(\.\d+)?([eE][+-]?\d+)?/.exec(src.slice(i, i + 400));
    if (!m || m[0] === "-") fail("Invalid number");
    const next = src[i + m[0].length];
    if (next !== undefined && /[0-9.xXeE]/.test(next)) fail("Invalid number (leading zeros, hex and trailing dots are not allowed)");
    i += m[0].length;
    return { t: "num", raw: m[0] };
  }

  const root = value();
  skip();
  if (i < src.length) fail("Unexpected " + describe(src[i]) + " after the end of the JSON value. Missing ',' or extra text?");
  return { root, fixes: [...fixes] };
}

/* ---------- Printer (Prettier-style) ----------
   Objects are always expanded one key per line. Arrays of plain values
   (numbers, strings, true/false/null) stay on one line if they fit the width. */

function isScalar(n) { return n.t === "num" || n.t === "str" || n.t === "lit"; }

function printJSON(node, opts) {
  const unit = opts.indent === "tab" ? "\t" : " ".repeat(opts.indent);
  const width = opts.width;

  function compact(n) {
    if (isScalar(n)) return n.raw;
    if (n.t === "arr") return "[" + n.items.map(compact).join(", ") + "]";
    return "{ " + n.entries.map(e => e.key.raw + ": " + compact(e.value)).join(", ") + " }";
  }

  function print(n, depth, used) {
    if (isScalar(n)) return n.raw;
    const pad = unit.repeat(depth + 1);
    const end = unit.repeat(depth);
    if (n.t === "arr") {
      if (n.items.length === 0) return "[]";
      if (width > 0 && n.items.every(isScalar)) {
        const one = compact(n);
        if (used + one.length <= width) return one;
      }
      const indentLen = opts.indent === "tab" ? (depth + 1) * 2 : pad.length;
      return "[\n" + n.items.map(it => pad + print(it, depth + 1, indentLen)).join(",\n") + "\n" + end + "]";
    }
    if (n.entries.length === 0) return "{}";
    const indentLen = opts.indent === "tab" ? (depth + 1) * 2 : pad.length;
    return "{\n" + n.entries.map(e => {
      const head = pad + e.key.raw + ": ";
      return head + print(e.value, depth + 1, indentLen + e.key.raw.length + 2 + 1);
    }).join(",\n") + "\n" + end + "}";
  }

  return print(node, 0, 0) + "\n";
}

function minifyJSON(n) {
  if (isScalar(n)) return n.raw;
  if (n.t === "arr") return "[" + n.items.map(minifyJSON).join(",") + "]";
  return "{" + n.entries.map(e => e.key.raw + ":" + minifyJSON(e.value)).join(",") + "}";
}

function sortKeys(n) {
  if (n.t === "arr") return { t: "arr", items: n.items.map(sortKeys) };
  if (n.t === "obj") {
    const entries = n.entries.map(e => ({ key: e.key, value: sortKeys(e.value) }));
    entries.sort((a, b) => a.key.text < b.key.text ? -1 : a.key.text > b.key.text ? 1 : 0);
    return { t: "obj", entries };
  }
  return n;
}

function countNodes(n) {
  if (isScalar(n)) return 1;
  if (n.t === "arr") return 1 + n.items.reduce((s, x) => s + countNodes(x), 0);
  return 1 + n.entries.reduce((s, e) => s + countNodes(e.value), 0);
}

// Exposed for tests run outside the browser.
if (typeof module !== "undefined") module.exports = { parseJSON, printJSON, minifyJSON, sortKeys };

/* ---------- UI ---------- */

if (typeof document !== "undefined") (function () {
  const $ = id => document.getElementById(id);
  const ta = $("text"), gutter = $("gutter"), statusEl = $("status"), msgEl = $("msg"),
        statsEl = $("stats"), placeholder = $("placeholder"), editor = $("editor"), toast = $("toast");
  const hintHTML = msgEl.innerHTML;
  const hl = $("hl"), codeEl = $("code"), errline = $("errline");
  const LINE_H = 20, PAD_TOP = 10;
  const HL_LIMIT = 300000; // most characters colored at once (visible part only)
  let lines = [""], linesFor = "";
  let lastError = null;

  const store = {
    get(k) { try { return localStorage.getItem("pjf." + k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem("pjf." + k, v); } catch (e) { /* storage unavailable */ } },
  };

  function opts() {
    const ind = $("indent").value;
    return { indent: ind === "tab" ? "tab" : Number(ind), width: Number($("width").value) };
  }

  function showToast(text) {
    toast.textContent = text;
    toast.classList.add("show");
    clearTimeout(showToast.t);
    showToast.t = setTimeout(() => toast.classList.remove("show"), 1400);
  }

  function renderGutter() {
    if (linesFor !== ta.value) { lines = ta.value.split("\n"); linesFor = ta.value; }
    gutter.style.minWidth = (String(lines.length).length * 8 + 24) + "px";
  }

  let charW = 0;
  function charWidth() {
    if (!charW) {
      const probe = document.createElement("span");
      probe.textContent = "0".repeat(100);
      hl.appendChild(probe);
      charW = probe.getBoundingClientRect().width / 100 || 8;
      probe.remove();
    }
    return charW;
  }

  const TOKEN = /("(?:[^"\\\n]|\\.)*"?|'(?:[^'\\\n]|\\.)*'?)(\s*:)?|(\/\/[^\n]*|\/\*[\s\S]*?(?:\*\/|$))|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)|\b(true|false|True|False)\b|\b(null|None|undefined)\b|([{}\[\],:])|([A-Za-z_$][\w$]*)(?=\s*:)/g;
  const esc = t => t.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

  function highlight(src) {
    let out = "", last = 0, m;
    TOKEN.lastIndex = 0;
    while ((m = TOKEN.exec(src))) {
      if (m.index > last) out += esc(src.slice(last, m.index));
      if (m[1] !== undefined) {
        out += m[2] !== undefined
          ? '<span class="k">' + esc(m[1]) + '</span><span class="p">' + esc(m[2]) + "</span>"
          : '<span class="s">' + esc(m[1]) + "</span>";
      } else if (m[3] !== undefined) out += '<span class="c">' + esc(m[3]) + "</span>";
      else if (m[4] !== undefined) out += '<span class="n">' + m[4] + "</span>";
      else if (m[5] !== undefined) out += '<span class="b">' + m[5] + "</span>";
      else if (m[6] !== undefined) out += '<span class="z">' + m[6] + "</span>";
      else if (m[7] !== undefined) out += '<span class="p">' + m[7] + "</span>";
      else out += '<span class="k">' + m[8] + "</span>";
      last = TOKEN.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  function paint() {
    renderGutter();
    drawView();
  }

  // Draws line numbers and colors for just the lines currently on screen.
  function drawView() {
    const top = ta.scrollTop, left = ta.scrollLeft;
    const first = Math.max(0, Math.floor((top - PAD_TOP) / LINE_H) - 2);
    const last = Math.min(lines.length, first + Math.ceil(ta.clientHeight / LINE_H) + 5);
    const shift = first * LINE_H - top;

    const badLine = lastError ? lastError.line : -1;
    let nums = "";
    for (let n = first + 1; n <= last; n++) nums += (n === badLine ? '<span class="bad">' + n + "</span>" : n) + "\n";
    gutter.innerHTML = '<div style="transform:translateY(' + shift + 'px)">' + nums + "</div>";

    let on = $("colors").checked;
    if (on) {
      // Very long lines (e.g. minified JSON) are cut just past the right edge of the view.
      const maxCol = Math.ceil((left + ta.clientWidth) / charWidth()) + 20;
      const view = lines.slice(first, last).map(l => l.length > maxCol ? l.slice(0, maxCol) : l).join("\n");
      on = view.length <= HL_LIMIT;
      if (on) {
        hl.innerHTML = highlight(view);
        hl.style.transform = "translate(" + (-left) + "px," + shift + "px)";
      }
    }
    if (!on) hl.textContent = "";
    codeEl.classList.toggle("highlighting", on);
  }

  let frame = 0;
  function syncScroll() {
    if (!frame) frame = requestAnimationFrame(() => { frame = 0; drawView(); });
    if (lastError) {
      errline.style.display = "block";
      errline.style.top = (10 + (lastError.line - 1) * 20 - ta.scrollTop) + "px";
    } else {
      errline.style.display = "none";
    }
  }

  function setStatus(kind, label, message) {
    statusEl.className = "status " + kind;
    statusEl.textContent = label;
    if (message === null) msgEl.innerHTML = hintHTML;
    else msgEl.textContent = message;
  }

  function bytes(s) {
    const b = new Blob([s]).size;
    return b < 1024 ? b + " B" : b < 1048576 ? (b / 1024).toFixed(1) + " KB" : (b / 1048576).toFixed(2) + " MB";
  }

  // Validates what's in the editor and updates the footer. Returns the parse result or null.
  function check() {
    const src = ta.value;
    placeholder.style.display = src ? "none" : "";
    statsEl.textContent = src ? (n => n + (n === 1 ? " line · " : " lines · "))(src.split("\n").length) + bytes(src) : "";
    if (!src.trim()) {
      lastError = null;
      setStatus("empty", "Empty", null);
      paint();
      return null;
    }
    try {
      const res = parseJSON(src, $("loose").checked);
      lastError = null;
      if (res.fixes.length) {
        setStatus("warn", "Loose JSON", "Not strict JSON yet (" + res.fixes.join(", ") + "). Press Format to fix it.");
      } else {
        const r = res.root;
        const what = r.t === "obj" ? "object, " + r.entries.length + " keys" : r.t === "arr" ? "array, " + r.items.length + " items" : "value";
        setStatus("ok", "Valid JSON", what + " · " + countNodes(r) + " values");
      }
      paint();
      return res;
    } catch (e) {
      lastError = e;
      setStatus("err", "Error at line " + e.line + ", col " + e.col, e.message + " (click the red label to jump there)");
      paint();
      return null;
    }
  }

  /* Undo history. The browser's own undo only works with execCommand("insertText"),
     which is very slow on large multi-line text, so the editor keeps its own. */
  const history = { stack: [], idx: -1, lastTyping: 0 };
  function record(typing) {
    const snap = { v: ta.value, s: ta.selectionStart, e: ta.selectionEnd };
    const cur = history.stack[history.idx];
    if (cur && cur.v === snap.v) { cur.s = snap.s; cur.e = snap.e; return; }
    const now = Date.now();
    // Group quick bursts of typing into one undo step.
    if (typing && cur && now - history.lastTyping < 800 && history.idx > 0) {
      history.stack[history.idx] = snap;
    } else {
      history.stack.length = history.idx + 1;
      history.stack.push(snap);
      if (history.stack.length > 100) history.stack.shift();
      history.idx = history.stack.length - 1;
    }
    history.lastTyping = typing ? now : 0;
  }
  function stepHistory(dir) {
    const next = history.stack[history.idx + dir];
    if (!next) return;
    history.idx += dir;
    history.lastTyping = 0;
    ta.value = next.v;
    ta.setSelectionRange(next.s, next.e);
    refresh();
  }

  // Replaces the text in [start, end) and records it as one undo step.
  function edit(text, start, end, select) {
    record(false);
    ta.setRangeText(text, start, end, select || "end");
    record(false);
    refresh();
  }

  // Replaces all text (Format, Minify, Paste, Open…).
  function setText(value) {
    ta.focus();
    edit(value, 0, ta.value.length, "start");
    ta.setSelectionRange(0, 0);
    ta.scrollTop = 0;
    ta.scrollLeft = 0;
    syncScroll();
  }

  function transform(fn, doneMsg) {
    const res = check();
    if (!res) {
      if (lastError) { jumpToError(); showToast("Fix the error first"); }
      return false;
    }
    const out = fn(res.root);
    if (out !== ta.value) setText(out);
    if (doneMsg) showToast(res.fixes.length ? doneMsg + " (fixed: " + res.fixes.join(", ") + ")" : doneMsg);
    return true;
  }

  const format = () => transform(r => printJSON(r, opts()), "Formatted");
  const minify = () => transform(r => minifyJSON(r), "Minified");
  const sort = () => transform(r => printJSON(sortKeys(r), opts()), "Keys sorted");

  function jumpToError() {
    if (!lastError) return;
    const at = Math.min(lastError.offset, ta.value.length);
    ta.focus();
    ta.setSelectionRange(at, Math.min(at + 1, ta.value.length));
    const lineH = 20;
    ta.scrollTop = Math.max(0, (lastError.line - 5) * lineH);
  }

  async function copyAll() {
    const v = ta.value;
    if (!v) { showToast("Nothing to copy"); return; }
    try {
      await navigator.clipboard.writeText(v);
    } catch (e) {
      const start = ta.selectionStart, end = ta.selectionEnd;
      ta.focus(); ta.select();
      document.execCommand("copy");
      ta.setSelectionRange(start, end);
    }
    showToast("Copied " + bytes(v));
  }

  // Puts new text in the editor, formatted first when "Format on paste" is on and it parses.
  function loadText(t) {
    if ($("autoFormat").checked) {
      try {
        const res = parseJSON(t, $("loose").checked);
        setText(printJSON(res.root, opts()));
        showToast(res.fixes.length ? "Formatted (fixed: " + res.fixes.join(", ") + ")" : "Formatted");
        return;
      } catch (e) { /* invalid: show it as-is so the error is visible */ }
    }
    setText(t);
  }

  async function pasteReplace() {
    try {
      loadText(await navigator.clipboard.readText());
    } catch (e) {
      ta.focus(); ta.select();
      showToast("Press Ctrl+V to paste");
    }
  }

  let saveTimer = null, checkTimer = null;
  // Re-check, re-color and save the draft. Large documents wait for a pause in typing.
  function refresh() {
    clearTimeout(checkTimer);
    if (ta.value.length > 200000) checkTimer = setTimeout(check, 150);
    else check();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => store.set("draft", ta.value.length < 2000000 ? ta.value : ""), 400);
  }

  ta.addEventListener("input", () => { record(true); refresh(); });
  ta.addEventListener("beforeinput", e => {
    if (e.inputType === "historyUndo") { e.preventDefault(); stepHistory(-1); }
    if (e.inputType === "historyRedo") { e.preventDefault(); stepHistory(1); }
  });
  ta.addEventListener("scroll", syncScroll);
  window.addEventListener("resize", syncScroll);

  ta.addEventListener("paste", e => {
    if (!$("autoFormat").checked) return;
    const text = (e.clipboardData || window.clipboardData).getData("text");
    const whole = ta.value === "" || (ta.selectionStart === 0 && ta.selectionEnd === ta.value.length);
    if (!whole || !text) return;
    try { parseJSON(text, $("loose").checked); } catch (err) { return; } // let invalid paste through untouched
    e.preventDefault();
    loadText(text);
  });

  ta.addEventListener("keydown", e => {
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.shiftKey && (e.key === "F" || e.key === "f")) { e.preventDefault(); format(); return; }
    if (mod && e.shiftKey && (e.key === "M" || e.key === "m")) { e.preventDefault(); minify(); return; }
    if (mod && e.shiftKey && (e.key === "C" || e.key === "c")) { e.preventDefault(); copyAll(); return; }
    if (mod && !e.altKey && (e.key === "z" || e.key === "Z")) { e.preventDefault(); stepHistory(e.shiftKey ? 1 : -1); return; }
    if (mod && !e.altKey && !e.shiftKey && (e.key === "y" || e.key === "Y")) { e.preventDefault(); stepHistory(1); return; }
    if (e.key === "Tab" && !mod && !e.altKey) {
      e.preventDefault();
      const unit = opts().indent === "tab" ? "\t" : " ".repeat(opts().indent);
      const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
      if (s === en && !e.shiftKey) { edit(unit, s, en); return; }
      // Indent / outdent the selected lines.
      const lineStart = v.lastIndexOf("\n", s - 1) + 1;
      const block = v.slice(lineStart, en);
      const changed = e.shiftKey
        ? block.split("\n").map(l => l.startsWith(unit) ? l.slice(unit.length) : l.replace(/^[ \t]+/, "")).join("\n")
        : block.split("\n").map(l => unit + l).join("\n");
      edit(changed, lineStart, en, "select");
      return;
    }
    if (e.key === "Enter" && !mod && !e.shiftKey && !e.altKey) {
      // Keep the current line's indent, and add one level after { or [.
      const s = ta.selectionStart, v = ta.value;
      const lineStart = v.lastIndexOf("\n", s - 1) + 1;
      const indent = /^[ \t]*/.exec(v.slice(lineStart, s))[0];
      const before = v.slice(lineStart, s).trimEnd().slice(-1);
      const unit = opts().indent === "tab" ? "\t" : " ".repeat(opts().indent);
      const after = v[ta.selectionEnd];
      let insert = "\n" + indent;
      let caretBack = 0;
      if (before === "{" || before === "[") {
        insert += unit;
        if ((before === "{" && after === "}") || (before === "[" && after === "]")) {
          insert += "\n" + indent;
          caretBack = 1 + indent.length;
        }
      }
      e.preventDefault();
      edit(insert, s, ta.selectionEnd);
      if (caretBack) { const p = ta.selectionStart - caretBack; ta.setSelectionRange(p, p); }
    }
  });

  document.addEventListener("keydown", e => {
    if (e.target === ta) return;
    const mod = e.ctrlKey || e.metaKey;
    if (mod && e.shiftKey && (e.key === "F" || e.key === "f")) { e.preventDefault(); format(); }
    if (mod && e.shiftKey && (e.key === "M" || e.key === "m")) { e.preventDefault(); minify(); }
  });

  $("btnFormat").onclick = format;
  $("btnMinify").onclick = minify;
  $("btnSort").onclick = sort;
  $("btnCopy").onclick = copyAll;
  $("btnPaste").onclick = pasteReplace;
  $("btnClear").onclick = () => { setText(""); ta.focus(); };
  statusEl.onclick = jumpToError;

  $("btnSave").onclick = () => {
    if (!ta.value) { showToast("Nothing to download"); return; }
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([ta.value], { type: "application/json" }));
    a.download = "formatted.json";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  };

  function loadFile(f) {
    if (!f) return;
    f.text().then(t => {
      loadText(t);
      showToast("Opened " + f.name);
    });
  }
  $("btnOpen").onclick = () => $("file").click();
  $("file").onchange = e => { loadFile(e.target.files[0]); e.target.value = ""; };
  editor.addEventListener("dragover", e => { e.preventDefault(); editor.classList.add("dragging"); });
  editor.addEventListener("dragleave", () => editor.classList.remove("dragging"));
  editor.addEventListener("drop", e => {
    editor.classList.remove("dragging");
    if (e.dataTransfer.files.length) { e.preventDefault(); loadFile(e.dataTransfer.files[0]); }
  });

  // Settings
  for (const id of ["indent", "width"]) {
    const saved = store.get(id);
    if (saved !== null && [...$(id).options].some(o => o.value === saved)) $(id).value = saved;
    $(id).onchange = () => {
      store.set(id, $(id).value);
      ta.style.tabSize = hl.style.tabSize = opts().indent === "tab" ? 4 : opts().indent;
      if (check()) format();
    };
  }
  for (const id of ["autoFormat", "loose", "colors"]) {
    const saved = store.get(id);
    if (saved !== null) $(id).checked = saved === "1";
    $(id).onchange = () => { store.set(id, $(id).checked ? "1" : "0"); check(); };
  }
  ta.style.tabSize = hl.style.tabSize = opts().indent === "tab" ? 4 : opts().indent;

  // Dark by default; the Theme button switches and remembers the choice.
  function applyTheme(t) {
    document.documentElement.dataset.theme = t;
    $("btnTheme").textContent = t === "dark" ? "☀ Light" : "☾ Dark";
  }
  applyTheme(store.get("theme") === "light" ? "light" : "dark");
  $("btnTheme").onclick = () => {
    const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
    applyTheme(next);
    store.set("theme", next);
  };

  const draft = store.get("draft");
  if (draft) ta.value = draft;
  record(false);
  check();
  ta.focus();
})();
</script>
</body>
</html>
